name = "denghuo"
main = "./worker/index.ts"
compatibility_date = "2026-11-01"
upload_source_maps = true

# 静态资源由 Cloudflare Vite 插件托管；directory / binding 由构建输出自动注入。
[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# 每 30 分钟预热首页缓存，让第一个访客不等冷启动
[triggers]
crons = ["*/30 * * * *"]

[[routes]]
pattern = "dh.ycxdev.com"
custom_domain = true

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "723ab269584b4019aceda1d81a91761a"

[vars]
SITE_NAME = "灯火影视"
VERSION = "1.0.0"
PUBLIC_MODE = "1"
# 默认源（苹果 CMS 接口）。来自夜幕影视实测榜单，逐条验证封面可经本站代理加载。
# 2026-11-27 复测：仅以下 6 源的封面代理 200，其余候选多为 502。可通过 KV 或管理接口覆盖。
DEFAULT_SOURCES = '[{"key":"dan","name":"艾旦影视","url":"https://lovedan.net/api.php/provide/vod","isAdult":false,"tier":1},{"key":"wj","name":"无尽资源","url":"https://api.wujinapi.me/api.php/provide/vod","isAdult":false,"tier":1},{"key":"hn","name":"红牛资源","url":"http://www.hongniuzy2.com/api.php/provide/vod","isAdult":false,"tier":1},{"key":"zd","name":"最大资源","url":"https://api.zuidapi.com/api.php/provide/vod","isAdult":false,"tier":1},{"key":"ikun","name":"爱坤资源","url":"https://ikunzyapi.com/api.php/provide/vod","isAdult":false,"tier":1},{"key":"iqy","name":"爱奇艺资源","url":"https://iqiyizyapi.com/api.php/provide/vod","isAdult":false,"tier":1}]'
DEFAULT_LIVE_SOURCES = '[{"key":"iptv","name":"iptv-org 全球","url":"https://iptv-org.github.io/iptv/index.m3u"},{"key":"guovin","name":"Guovin 央视/卫视","url":"https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/ipv4/result.m3u"},{"key":"gntv","name":"GNTV 港台/国际","url":"https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u"}]'
