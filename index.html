<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="灯火影视 — 轻量、开放、自主可控的在线视频聚合播放站" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/youtube-white-32.png" />
    <link rel="apple-touch-icon" href="/icons/youtube-white-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>灯火影视</title>
    <script>
      // 首帧前应用已保存的主题，避免白/黑闪屏。
      try {
        const saved = JSON.parse(localStorage.getItem('denghuo:v1') || '{}');
        const theme = saved.settings?.theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#ffffff' : '#000000');
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
